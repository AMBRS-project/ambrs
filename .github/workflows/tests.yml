name: tests

# This action is triggered:
# 1. when someone creates a pull request for a merge to the main branch
# 2. when changes are merged into the main branch (via a pull request)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    # we support Linux and macOS
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    # Steps for running tests and analysis.
    steps:
      - name: Checking out repository (${{ matrix.os }})
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Setting up Python 3.12 (${{ matrix.os }})
        uses: actions/setup-python@v5.1.1
        with:
          python-version: "3.12"

      - name: Installing ambrs dependencies (${{ matrix.os }})
        run: python3 -m pip install -r requirements.txt

      - name: Running tests (${{ matrix.os }})
        run: |
          coverage run --source=ambrs -m pytest
          coverage xml

      - if: ${{ matrix.os == 'ubuntu-latest' }}
        name: Uploading coverage report to codecov.io
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  wheel:
    name: Build and test wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build setuptools twine wheel

      - name: Build and inspect wheel
        run: |
          python -m build --wheel --no-isolation
          python -m twine check dist/*.whl

      - name: Install wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check

      - name: Test the installed wheel
        run: |
          mv ambrs "${RUNNER_TEMP}/ambrs-source"
          python -c "import ambrs; print(f'Testing {ambrs.__file__}')"
          python -m pytest test
