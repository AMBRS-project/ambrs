[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambrs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.7.22",
    "cftime>=1.6.6",
    "contourpy>=1.4.0",
    "coverage>=7.16.2",
    "cycler>=0.12.1",
    "fonttools>=4.66.1",
    "kiwisolver>=1.5.1",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.4",
    "numpy>=2.5.3",
    "packaging>=26.3",
    "pandas>=3.0.6",
    "part2pop>=1.1.0",
    "pillow>=12.3.0",
    "pydoe==0.3.8",
    "pyparsing>=3.3.3",
    "pytest>=9.1.1",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2026.5",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "six>=1.17.0",
    "tzdata>=2026.5",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=7.4.0",
    "ipynotebook>=0.1.0",
    "nbconvert>=7.17.1",
]

# restrict package discovery to ambrs itself, excluding test/tutorial/runs
[tool.setuptools.packages.find]
include = ["ambrs*"]
